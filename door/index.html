<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lifted Strength Club</title>
<meta name="description" content="Lifted Strength Club — strength training for mental health. Enter the club.">
<link rel="icon" href="lifted-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#242424;--charcoal-d:#1a1a1a;--teal:#17505B;--brass:#B78B52;
    --cream:#F7F4EF;--muted:#9a938a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Outfit',system-ui,sans-serif;background:var(--charcoal-d);
    color:var(--cream);-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
  }
  /* the room behind the doors */
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 42%, #20363b 0%, #182226 42%, #121618 100%);}
  .welcome{text-align:center;opacity:0;transform:translateY(14px);transition:opacity 1s ease .35s, transform 1s ease .35s;padding:0 24px}
  .welcome .brand{font-family:'Cormorant Garamond',serif;font-weight:500;font-style:italic;
    font-size:clamp(1.9rem,6vw,3.4rem);color:var(--cream);line-height:1.05}
  .welcome .brand em{color:var(--brass);font-style:italic}
  .welcome .sub{margin-top:16px;font-size:.78rem;letter-spacing:.34em;text-transform:uppercase;color:var(--muted)}
  .welcome .spin{margin-top:30px;width:26px;height:26px;border:2px solid rgba(255,255,255,.15);
    border-top-color:var(--brass);border-radius:50%;display:inline-block;animation:sp 1s linear infinite;opacity:0;transition:opacity .4s}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* the two doors */
  .door{position:fixed;top:0;bottom:0;width:50.5vw;background:
      linear-gradient(180deg,#2f2f2f 0%, #262626 50%, #1f1f1f 100%);
    z-index:5;transition:transform 1.25s cubic-bezier(.76,0,.24,1);
    box-shadow:0 0 60px rgba(0,0,0,.6);overflow:hidden}
  .door::before{content:"";position:absolute;inset:0;
    background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 1px,transparent 1px 42px);}
  .door.left{left:0;border-right:1px solid rgba(0,0,0,.5)}
  .door.right{right:0;border-left:1px solid rgba(0,0,0,.5)}
  /* brass seam line + handles */
  .door.left::after,.door.right::after{content:"";position:absolute;top:66%;transform:translateY(-50%);
    width:7px;height:110px;border-radius:6px;background:linear-gradient(180deg,#d8b57a,#8a6835);box-shadow:0 4px 14px rgba(0,0,0,.5);opacity:.9}
  .door.left::after{right:9vw}
  .door.right::after{left:9vw}
  @media(max-width:700px){.door.left::after{right:5vw}.door.right::after{left:5vw}}

  /* the front-door content (logo + enter) sits on the doors */
  .front{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:38px;transition:opacity .6s ease}
  .front .logo{width:min(300px,62vw);height:auto;filter:drop-shadow(0 6px 30px rgba(0,0,0,.5))}
  .front .tag{font-family:'Cormorant Garamond',serif;font-size:clamp(1.05rem,3.4vw,1.5rem);color:var(--muted);letter-spacing:.04em;font-style:italic;margin-top:-14px}
  .enter{appearance:none;border:1px solid rgba(183,139,82,.6);background:transparent;color:var(--cream);
    font-family:'Outfit',sans-serif;font-size:.82rem;letter-spacing:.28em;text-transform:uppercase;font-weight:500;
    padding:16px 40px;border-radius:44px;cursor:pointer;transition:.35s;position:relative}
  .enter:hover{background:var(--brass);border-color:var(--brass);color:#241c0e;letter-spacing:.32em}
  .hint{font-size:.68rem;letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.32);
    animation:pulse 2.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.32}50%{opacity:.7}}

  /* OPEN state */
  body.opening .door.left{transform:translateX(-102%)}
  body.opening .door.right{transform:translateX(102%)}
  body.opening .front{opacity:0;pointer-events:none}
  body.opening .welcome{opacity:1;transform:none}
  body.opening .welcome .spin{opacity:1}
  @media (prefers-reduced-motion: reduce){
    .door{transition:opacity .5s} body.opening .door{transform:none;opacity:0}
  }
</style>
</head>
<body>
  <!-- room revealed behind -->
  <div class="stage" aria-hidden="true">
    <div class="welcome">
      <div class="brand">Welcome to <em>Lifted</em></div>
      <div class="sub">Strong mind · strong body · strong life</div>
      <div class="spin"></div>
    </div>
  </div>

  <!-- the doors -->
  <div class="door left" aria-hidden="true"></div>
  <div class="door right" aria-hidden="true"></div>

  <!-- the front face -->
  <main class="front">
    <img class="logo" src="lifted-logo-white.png" alt="Lifted Strength Club">
    <div class="tag">Strength training for mental health</div>
    <button class="enter" id="enter" aria-label="Enter the site">Enter&nbsp;the&nbsp;Club</button>
    <div class="hint">Tap to enter</div>
  </main>

<script>
  var DEST = "/";
  var opened = false;
  function enter(){
    if(opened) return; opened = true;
    document.body.classList.add("opening");
    // let the doors finish opening, then hand off
    setTimeout(function(){ window.location.href = DEST; }, 1450);
  }
  document.getElementById("enter").addEventListener("click", function(e){ e.stopPropagation(); enter(); });
  // tapping anywhere on the door face also opens it
  document.querySelector(".front").addEventListener("click", enter);
  // keyboard: Enter / Space
  document.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" ") enter(); });
</script>
</body>
</html>
